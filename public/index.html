<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06051A">
  <title>KK Lab · Бухгалтерія</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/img/logo.png">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <img src="/img/logo.png" alt="" width="28" height="28">
        <div>
          <div class="brand-name" id="company">King Kong Lab</div>
          <div class="brand-sub" id="who">Бухгалтерія</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" title="Пошук">⌕</button>
        <button class="icon-btn" id="exportBtn" title="Excel">↓</button>
      </div>
    </header>

    <div id="searchBar" class="search-bar hidden">
      <input id="searchInput" placeholder="Клієнт, проєкт, коментар…" autocomplete="off">
    </div>
    <div id="searchResults" class="sheet hidden"></div>

    <main id="view"></main>

    <nav class="tabs" id="tabs">
      <button data-tab="dash">Дашборд</button>
      <button data-tab="tx">Операції</button>
      <button class="fab" data-tab="new" aria-label="Додати">+</button>
      <button data-tab="projects">Проєкти</button>
      <button data-tab="more">Ще</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="gate" class="gate hidden"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
