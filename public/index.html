<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06051A">
  <title>KK Lab · Бухгалтерія</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app.css?v=7">
  <link rel="stylesheet" href="/tasks.css?v=7">
  <link rel="icon" href="/img/logo.png">
</head>
<body>
  <div id="gate" class="gate">
    <div class="landing">
      <img src="/img/logo.png" alt="King Kong Lab">
      <h1>King Kong Lab</h1>
      <p class="muted">Бухгалтерія команди</p>
      <a id="openTg" class="btn" href="https://t.me/KKLabSystemBot?startapp">Відкрити в Telegram</a>
      <p id="gateMsg" class="muted">Відкрий через бота — так застосунок запуститься з твоїм доступом.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="top">
      <div class="brand">
        <img src="/img/logo.png" alt="" width="28" height="28">
        <div>
          <div class="brand-name" id="company">King Kong Lab</div>
          <div class="brand-sub" id="who">Бухгалтерія</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" title="Пошук">⌕</button>
        <button class="icon-btn" id="exportBtn" title="Excel">↓</button>
        <button class="icon-btn" id="moreBtn" title="Ще: звіти, рахунки, налаштування">☰</button>
      </div>
    </header>

    <div id="searchBar" class="search-bar hidden">
      <input id="searchInput" placeholder="Клієнт, проєкт, коментар…" autocomplete="off">
    </div>
    <div id="searchResults" class="sheet hidden"></div>

    <main id="view"></main>

    <nav class="tabs" id="tabs">
      <button data-tab="dash"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg></i>Дашборд</button>
      <button data-tab="tx"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg></i>Операції</button>
      <button class="fab" data-tab="new" aria-label="Створити">+</button>
      <button data-tab="deals"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></i>Проєкти</button>
      <button data-tab="tasks"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.5 2.7 2.7L16.5 9"/></svg></i>Задачі</button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js?v=8"></script>
  <script src="/tasks.js?v=12"></script>
</body>
</html>
